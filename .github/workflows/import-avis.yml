name: Import des avis BOAMP et TED

on:
  schedule:
    # Chaque matin à 5 h 30 UTC : les avis de la veille sont publiés au plus tard dans la nuit.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      depuis:
        description: "Reprendre les avis depuis cette date (AAAA-MM-JJ), sinon depuis le dernier import"
        required: false

concurrency:
  group: import-avis
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Vérifier que la base est configurée
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secret DATABASE_URL absent : import ignoré. Ajoutez-le dans Settings > Secrets and variables > Actions."
            echo "pret=false" >> "$GITHUB_OUTPUT"
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.pret == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.pret == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.config.outputs.pret == 'true'
      - run: npm run import:avis -- ${DEPUIS:+--depuis "$DEPUIS"}
        if: steps.config.outputs.pret == 'true'
        env:
          DEPUIS: ${{ inputs.depuis }}
